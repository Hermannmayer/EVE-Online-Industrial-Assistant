repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # 项目运行时依赖：mypy 隔离环境需真实类型才能正确解析（缺依赖 → Any 传播误报）
        additional_dependencies:
          - types-PySide6
          - aiohttp~=3.13.0
          - aiosqlite~=0.22.0
          - tenacity~=9.0.0
          - pyyaml~=6.0.0
          - openpyxl~=3.1.0
          - tqdm~=4.67.0
        args: [--ignore-missing-imports, --config-file, pyproject.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]

  # ── 文档联动（本地钩子，system python）──
  - repo: local
    hooks:
      # 文档站内部链接检查（防孤儿链接：删文件后残留引用自动报警）
      #
      # 原先还有 3 个钩子（gen-api-docs / check-readme / docs-stale-reminder），已移除：
      # 它们会在 commit 时改写 127 个 docs/api/*.md、并强制同步 README 里的测试总数，
      # 制造"提交被拒 → 重新 add → 再提交"的反复摩擦，而防止的失配几乎不发生。
      # 需要时手动跑：`python scripts/gen_api_docs.py`
      - id: check-docs-links
        name: check docs internal links
        entry: python scripts/check_docs_links.py
        language: system
        pass_filenames: false
        always_run: true
