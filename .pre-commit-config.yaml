repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # 项目运行时依赖：mypy 隔离环境需真实类型才能正确解析（缺依赖 → Any 传播误报）
        additional_dependencies:
          - types-PySide6
          - aiohttp~=3.13.0
          - aiosqlite~=0.22.0
          - tenacity~=9.0.0
          - pyyaml~=6.0.0
          - openpyxl~=3.1.0
          - tqdm~=4.67.0
        args: [--ignore-missing-imports, --config-file, pyproject.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]

  # ── 文档联动（本地钩子，system python）──
  - repo: local
    hooks:
      # 1) 业务代码变更时自动重新生成 API 文档（docs/api/*.md 跟随提交，
      #    与 GitHub Pages 部署同步；有改动则需 git add 后重新提交）
      - id: gen-api-docs
        name: generate api docs from source
        entry: python scripts/gen_api_docs.py
        language: system
        pass_filenames: false
        files: ^(core/|services/|ui_pyside6/(models|workers)/)

      # 2) README 动态数据校验（测试总数 / 测试文件清单与实际一致）
      - id: check-readme
        name: check readme dynamic data
        entry: python scripts/check_readme.py
        language: system
        pass_filenames: false
        always_run: true

      # 3) 文档站内部链接检查（防孤儿链接：删文件后残留引用自动报警）
      - id: check-docs-links
        name: check docs internal links
        entry: python scripts/check_docs_links.py
        language: system
        pass_filenames: false
        always_run: true

      # 4) 业务代码变更 → 提醒同步更新说明文档（不阻塞提交）
      - id: docs-stale-reminder
        name: remind to update docs on code changes
        entry: python scripts/check_docs_stale.py
        language: system
        pass_filenames: false
        always_run: true
