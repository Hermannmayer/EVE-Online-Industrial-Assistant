[project]
name = "eve-industrial-assistant"
version = "0.15.2"
description = "EVE Online 工业制造助手（PySide6 桌面应用）"
requires-python = ">=3.14"
dependencies = [
    "PySide6~=6.11.0",
    "aiohttp~=3.13.0",
    "aiosqlite~=0.22.0",
    "tenacity~=9.0.0",
    "tqdm~=4.67.0",
    "PyYAML~=6.0.0",
    "openpyxl~=3.1.0",
    "watchdog~=6.0.0",
]

[dependency-groups]
dev = [
    "pytest~=9.0.0",
    "pytest-qt~=4.5.0",
    "pytest-cov~=5.0.0",
    "pytest-asyncio~=1.4.0",
    "ruff~=0.15.0",
    "mypy~=2.3.0",
    "python-semantic-release~=10.6.1",
    "pyinstaller~=6.20.0",   # build_release.py 打包（release.yml 用）
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "B",  # flake8-bugbear
    "I",  # isort
    "M",  # flake8-mypy
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "services", "tools", "ui_pyside6"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
# 目标平台：Windows 桌面应用（打包/运行均在 Windows）。
# 默认按 sys.platform（Linux CI 上为 linux）检查会使 ctypes.windll 等
# Windows 专用代码在 CI 报错，这里固定为 win32。
platform = "win32"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "aiohttp.*",
    "aiosqlite.*",
    "yaml.*",
    "openpyxl.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
# 测试运行超过该秒数时 dump 所有线程栈（faulthandler），便于定位偶发卡住的测试
faulthandler_timeout = 120
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "ui: marks tests as UI tests (deselect with '-m \"not ui\"')",
]

# ─────────────────────────────────────────────────────────────
#  python-semantic-release（自动发版）
#
#  版本规则（semver 2.0.0，0.x 阶段同样适用）：
#     - feat 递增 MINOR（0.7.0 → 0.8.0）
#     - fix/perf 递增 PATCH（0.7.0 → 0.7.1）
#     - 其余类型（docs/ci/chore/refactor/test/build/style）不触发发版
#     - allow_zero_version = true：允许停留在 0.x，不会因任何提交直接跳到 1.0.0
#     - major_on_zero = false：大版本（1.0.0 及以后）由用户手动决定
# ─────────────────────────────────────────────────────────────
[tool.semantic_release]
commit_parser = "conventional"   # angular 在 v10 已废弃，改用其继承者
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
version_variables = ["core/version.py:__version__"]  # 自动改写唯一版本源
version_toml = ["pyproject.toml:version"]            # 同步 pyproject 版本
allow_zero_version = true
major_on_zero = false
build_command_env = []

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.remote]
type = "github"
ignore_token_for_push = false

[tool.semantic_release.publish]
dist_glob_patterns = []          # 安装包由 release.yml 另行上传
upload_to_vcs_release = true     # 创建 GitHub Release（changelog 作为 release notes）
