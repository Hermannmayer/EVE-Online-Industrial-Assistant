[project]
name = "eve-industrial-assistant"
version = "1.4.0"
description = "EVE Online 工业制造助手（PySide6 桌面应用）"
requires-python = ">=3.14"
dependencies = [
    "PySide6~=6.11.0",
    "aiohttp~=3.13.0",
    "aiosqlite~=0.22.0",
    "tenacity~=9.0.0",
    "tqdm~=4.67.0",
    "PyYAML~=6.0.0",
    "openpyxl~=3.1.0",
    "watchdog~=6.0.0",
]

[dependency-groups]
dev = [
    "pytest~=9.0.0",
    "pytest-qt~=4.5.0",
    "pytest-cov~=5.0.0",
    "pytest-asyncio~=1.3.0",
    "ruff~=0.15.0",
    "mypy~=2.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "B",  # flake8-bugbear
    "I",  # isort
    "M",  # flake8-mypy
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "services", "tools", "ui_pyside6"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "aiohttp.*",
    "aiosqlite.*",
    "yaml.*",
    "openpyxl.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "ui: marks tests as UI tests (deselect with '-m \"not ui\"')",
]
