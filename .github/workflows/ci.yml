name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv

    - name: Install dependencies (uv sync --dev)
      run: uv sync --dev

    # PySide6 在无显示 Linux 上需要 EGL/GL 系统库（QT_QPA_PLATFORM=offscreen 依赖它们）
    - name: Install Qt system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1

    - name: Lint with ruff
      run: |
        uv run ruff check .
      # 注：不跑 `ruff format --check .` —— 仓库存在 30 个历史未格式化文件
      # （超出本任务「业务代码一律不动」约束），跑则 CI 恒红。整改应单独立项。

    - name: Type check with mypy
      run: uv run mypy . --ignore-missing-imports

    - name: Test with pytest
      run: uv run pytest tests/ -v --cov=. --cov-report=xml
      env:
        QT_QPA_PLATFORM: offscreen   # 无显示环境下跑 Qt 测试

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # 版本一致性：core/version.py == CHANGELOG 最新版本段 == git tag（发版态）
  version-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # 需要完整历史 + tag 才能校验发版态

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: 版本一致性校验
      run: python scripts/check_version.py
