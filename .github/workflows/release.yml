name: Release

# push main 时自动发版：semantic-release version → build_release → 上传安装包
# 关键：semantic-release 用 GITHUB_TOKEN push 不会再次触发本 workflow（防止死循环）

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write    # 创建 tag + commit + push + Release

jobs:
  release:
    runs-on: windows-latest   # build_release.py (PyInstaller) 需要 Windows
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0           # semantic-release 需要完整 git 历史
        persist-credentials: true

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv

    - name: Install dependencies
      run: uv sync --dev

    - name: Python Semantic Release
      id: semver
      run: uv run python -m semantic_release version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONUTF8: "1"

    # 无发版提交（NO_RELEASE）时 released 为空 → 跳过打包与上传
    - name: Build release package
      if: steps.semver.outputs.released == 'true'
      run: uv run python build_release.py
      env:
        PYTHONUTF8: "1"

    - name: Upload zip to GitHub Release
      if: steps.semver.outputs.released == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.semver.outputs.tag }}
        files: dist/EVE商人助手_v*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
